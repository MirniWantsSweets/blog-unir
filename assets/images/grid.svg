      <stop offset="0" stop-color="#efe6fb"/>
      <stop offset="1" stop-color="#fbf8ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Column guides (12 columns) -->
  <g fill="#c9b3ee" opacity="0.45">
    <rect x="60" y="40" width="46" height="370"/>
    <rect x="116" y="40" width="46" height="370"/>
    <rect x="172" y="40" width="46" height="370"/>
    <rect x="228" y="40" width="46" height="370"/>
    <rect x="284" y="40" width="46" height="370"/>
    <rect x="340" y="40" width="46" height="370"/>
    <rect x="396" y="40" width="46" height="370"/>
    <rect x="452" y="40" width="46" height="370"/>
    <rect x="508" y="40" width="46" height="370"/>
    <rect x="564" y="40" width="46" height="370"/>
    <rect x="620" y="40" width="46" height="370"/>
    <rect x="676" y="40" width="46" height="370"/>
  </g>
  <!-- Header -->
  <rect x="60" y="60" width="662" height="60" rx="10" fill="#4b2e83"/>
