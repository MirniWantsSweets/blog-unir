    <rect x="306" y="164" width="120" height="12" rx="6"/>
    <rect x="306" y="190" width="170" height="12" rx="6"/>
    <rect x="534" y="164" width="120" height="12" rx="6"/>
    <rect x="534" y="190" width="170" height="12" rx="6"/>
  </g>
  <!-- Sidebar + main -->
  <rect x="60" y="268" width="206" height="122" rx="10" fill="#7a5bb8"/>
  <rect x="288" y="268" width="434" height="122" rx="10" fill="#ffffff" stroke="#4b2e83" stroke-width="4"/>
  <g fill="#b9a6e0">
    <rect x="310" y="290" width="300" height="12" rx="6"/>
